name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (3.13)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TT_FORCE: "1"
    defaults:
      run:
        working-directory: quarry
    steps:
      - name: Check out quarry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: quarry
      - name: Check out refs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: verifiably/refs
          path: refs
      - name: Check out nodes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: verifiably/nodes
          path: nodes
      - name: Populate refs registry data
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p refs/python/src/refs/data
          cp refs/registry/* refs/python/src/refs/data/
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.11.29"
          python-version: "3.13"
          cache-dependency-glob: "quarry/uv.lock"
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Prepare coverage evidence
        run: |
          evidence="${RUNNER_TEMP}/quarry-ci-evidence"
          rm -rf "${evidence}"
          mkdir -p "${evidence}"
          printf 'QUARRY_CI_EVIDENCE_DIR=%s\n' "${evidence}" >> "${GITHUB_ENV}"
          {
            printf 'quarry %s\n' "${GITHUB_SHA}"
            printf 'refs %s\n' "$(git -C "${GITHUB_WORKSPACE}/refs" rev-parse HEAD)"
            printf 'nodes %s\n' "$(git -C "${GITHUB_WORKSPACE}/nodes" rev-parse HEAD)"
            printf '\n[test modules]\n'
            find tests -maxdepth 2 -name 'test_*.py' | sort
          } > "${evidence}/module-inventory.txt"
      - name: Install Python dependencies
        run: uv sync --frozen --group dev
      - name: Run Python hygiene and test suite
        run: just ci-python
      - name: Require coverage evidence
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ["QUARRY_CI_EVIDENCE_DIR"])
          inventory = root / "module-inventory.txt"
          if not inventory.is_file() or not inventory.read_text(encoding="utf-8").strip():
              raise SystemExit(f"missing or empty module inventory: {inventory}")
          report = root / "pytest.xml"
          if not report.is_file():
              raise SystemExit(f"missing JUnit report: {report}")
          suites = ET.parse(report).getroot()
          nodes = [suites] if suites.tag == "testsuite" else list(suites.findall("testsuite"))
          tests = sum(int(node.attrib.get("tests", "0")) for node in nodes)
          skipped = sum(int(node.attrib.get("skipped", "0")) for node in nodes)
          failures = sum(int(node.attrib.get("failures", "0")) for node in nodes)
          errors = sum(int(node.attrib.get("errors", "0")) for node in nodes)
          executed = tests - skipped
          print(f"JUnit summary: tests={tests} executed={executed} skipped={skipped} failures={failures} errors={errors}")
          if executed <= 0 or skipped != 0 or failures > 0 or errors > 0:
              raise SystemExit("unacceptable JUnit summary")
          PY
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-3.13-coverage
          path: ${{ env.QUARRY_CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
