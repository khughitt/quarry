id = "jsoc"
name = "Joint Science Operations Center (SDO HMI and AIA)"
roles = ["repository"]
prefixes = ["jsoc"]
adapter = "quarry.adapters.jsoc"

[[routes]]
kind = "rest"
url = "http://jsoc.stanford.edu/cgi-bin/ajax"
min_interval = 1.0
service = "jsoc"
auth = "none"
reports_total = true

[[routes]]
kind = "rest"
url = "http://jsoc.stanford.edu/cgi-bin/ajax/jsoc_fetch"
min_interval = 1.0
service = "jsoc"
auth = "required-key"
key_env = "JSOC_NOTIFY_EMAIL"
key_param = "notify"
reports_total = false

[[routes]]
kind = "bulk"
url = "http://jsoc.stanford.edu"
min_interval = 1.0
service = "jsoc"
auth = "none"
reports_total = false

[[pitfalls]]
summary = "record-set times are TAI unless suffixed _UTC, and prime-key slot ranges include their end and snap to nearby slot centers"
handling = "every time the adapter emits carries _UTC; TAI T_REC values returned by HMI series are converted to UTC and results are trimmed to half-open [START, END)"
evidence = "sun phase-1 survey probes/jsoc/03; X-25 live boundary probe"

[[pitfalls]]
summary = "a time keyword in a where clause must be wrapped in $(); a bare string is a Postgres type error"
handling = "release-date comparisons compile to [? DATE >= $(YYYY.MM.DD_00:00:00_UTC) ?] and [? DATE < $(YYYY.MM.DD_00:00:00_UTC) ?]"
evidence = "probes/jsoc/14, 16"

[[pitfalls]]
summary = "segment URLs are SUMS paths valid only while the record is online, and they redirect to jsoc1"
handling = "URLs are resolved at request time with rs_list seg=**ALL** R=1; offline records and non-SUMS placeholders never invent URLs; the reproducible part of an acquisition is the record-set specifier"
evidence = "probes/jsoc/04, 11, 19"

[[pitfalls]]
summary = "the export route refuses without a registered email, is asynchronous (exp_request then exp_status until status 0), and can complete with an empty file list; no digests on any route"
handling = "required-key route (JSOC_NOTIFY_EMAIL); acquisition prefers rs_list with R=1 (online SUMS paths) over export; empty export completion fails upstream_failed rather than inventing locations"
evidence = "probes/jsoc/05, 18, 20, 21, 22, 11"
