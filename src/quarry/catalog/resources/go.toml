id = "go"
name = "Gene Ontology"
roles = ["ontology"]
prefixes = ["go"]
adapter = "quarry.adapters.ols"

[[routes]]
kind = "rest"
url = "https://www.ebi.ac.uk/ols4/api/ontologies/go"
min_interval = 0.5
service = "ebi-ols"
auth = "none"
reports_total = true
page_cap = 100

[[pitfalls]]
summary = "OLS returns OBO-cased ids (NCBITaxon:9606) and cross-reference databases refs may not know"
handling = "every id is re-parsed to its canonical CURIE; an unparsable primary id fails with upstream_failed, an unparsable cross-reference is left out and named in warnings"
evidence = "quarry-78e681 OLS4 probe 2026-11-01, GO:0000005"

[[pitfalls]]
summary = "OLS _links hrefs are http://"
handling = "the adapter builds every URL from the route's https base and never follows a returned link"
evidence = "quarry-78e681 OLS4 probe 2026-11-01, GO:0000005"

[[pitfalls]]
summary = "term_replaced_by is a short form (GO_0008150) and consider holds OBO PURLs; an obsolete term's label can be its short form (GO_0000004)"
handling = "both become CURIEs through obo_text before ids.parse; the label prints as given"
evidence = "quarry-78e681 OLS4 probe 2026-11-01, GO:0000005"

[[pitfalls]]
summary = "q is Solr syntax: * and ? are wildcards, a colon makes a field query, () and ~ change parsing, several words are ANDed"
handling = "term search refuses Lucene metacharacters, a leading + or -, the words AND, OR and NOT, and a non-CURIE colon (unsupported_filter); the skill says words are ANDed"
evidence = "quarry-78e681 OLS4 probe 2026-11-01, GO:0000005"

[[pitfalls]]
summary = "OLS loads go-plus; an obsolete term can carry no term_replaced_by but list consider"
handling = "show prints obsolete, replaced_by when given, and consider"
evidence = "quarry-78e681 OLS4 probe 2026-11-01, GO:0000005"
