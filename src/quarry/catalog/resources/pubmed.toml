id = "pubmed"
name = "PubMed"
roles = ["literature-index"]
prefixes = ["pubmed"]
adapter = "quarry.adapters.pubmed"

[[routes]]                             # the same E-utilities service as GEO: one throttle, one key
kind = "rest"
url = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
min_interval = 0.34
service = "ncbi-eutils"
auth = "optional-key"
key_env = "NCBI_API_KEY"
key_param = "api_key"
keyed_min_interval = 0.1
reports_total = true
page_cap = 10000

[[routes]]                             # PMC OAI-PMH front-matter preflight (pmc_fm) for show and files
kind = "rest"
url = "https://pmc.ncbi.nlm.nih.gov/api/oai/v1/mh"
min_interval = 0.34
service = "ncbi-pmc-oai"
auth = "none"
reports_total = false

[[pitfalls]]
summary = "PubMed maps phrases through automatic term mapping and, when a phrase is not indexed, searches its words ANDed"
handling = "coverage says match: expanded; --exact refuses PubMed; --native sends PubMed syntax unchanged"
evidence = "PubMed help: automatic term mapping and phrase searching"

[[pitfalls]]
summary = "esearch serves at most 10,000 ids per query without the history server"
handling = "a count above the window is refused with too_many_results before any summary request; -n inside the window is served"
evidence = "E-utilities documentation; mm-159cb7's reviews search capped retmax by hand"

[[pitfalls]]
summary = "Entrez drops a term it has no records for (or a field tag it does not know) and answers for the rest, never widening the query"
handling = "esearch reads errorlist and warninglist; each term Entrez found nothing for or ignored becomes a warning in the search report, in NCBI's spelling"
evidence = "probe 2026-10-11 (db=gds, the same esearch): unknown phrases are named in warninglist.quotedphrasesnotfound and errorlist.phrasesnotfound, unknown field tags in errorlist.fieldsnotfound"

[[pitfalls]]
summary = "esummary articleids reports PMC archive presence (pmc:PMC...), not Open Access full-text eligibility or licence metadata, and OAI set pmc-open includes non-OA NIH author manuscripts (pmc-prop-open-access = no)"
handling = "search sets only in_pmc (Y or N) from esummary; show and files query ncbi-pmc-oai GetRecord (metadataPrefix=pmc_fm) for unversioned PMCIDs to read pmc-prop-open-access, pmc-prop-in-epmc, and pmc-license-ref, omitting open_access when a record is not in PMC and preserving versioned pmc: cross-references with in_pmc=Y while withholding file locators"
evidence = "quarry-39c207 survey (2026-11-06): PMC2830579 and PMC13274558 carry pmc: cross-references in esummary while pmc_fm reports pmc-prop-open-access = no"

[[pitfalls]]
summary = "efetch.fcgi?db=pmc returns bodyless XML stubs on non-OA publisher deposits and returns body-containing XML on non-OA NIH author manuscripts (pmc-prop-open-access = no), while PubTator3 updates weekly and export/biocjson?pmids=...&full=true returns HTTP 200 abstract stubs for non-OA PMIDs"
handling = "files emits <PMCID>.xml (efetch.fcgi?db=pmc) and <PMCID>.bioc.json (pmc_export/biocjson?pmcids=<PMCID>, which fails closed with HTTP 400 on non-OA records) only when open_access=Y, in_pmc=Y, pmc-status-embargo=no, and pmc-prop-pdf-only=no; metadata eligibility does not guarantee PubTator3 has indexed a newly released OA article or that ncbi-pmc-oai (throttled at 0.34 s per process, no concurrent requests) is up"
evidence = "quarry-39c207 survey (2026-11-06): PMC5798764 (OA), PMC2830579 (non-OA deposit), PMC13274558 (NIHMS2179551 author manuscript); PubTator3 API documentation"
